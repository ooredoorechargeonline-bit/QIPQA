<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حدد تاريخ بدء التأمين - QIC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #f3f2f7;
    display: flex;
    justify-content: center;
    padding: 0;
  }

  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    background: #f3f2f7;
    position: relative;
    overflow: hidden;
  }

  .topbar { padding: 22px 20px 18px; }
  .topbar-row { position: relative; display: flex; align-items: center; justify-content: center; }
  .qic-logo { height: 30px; display: block; }
  .topbar-row svg { position: absolute; right: 0; }
  .progress-track {
    margin-top: 18px; height: 6px; background: #e3e1f2; border-radius: 999px; overflow: hidden;
    display: flex;
  }
  .progress-fill-soft { height: 100%; width: 8%; background: #bdeed0; }
  .progress-fill { height: 100%; width: 90%; background: #4fc271; border-radius: 0 999px 999px 0; }

  .card2 {
    background: #fff; border-radius: 28px 28px 0 0; padding: 30px 22px 34px;
  }

  h2 { font-size: 26px; color: #1c1830; text-align: right; margin-bottom: 26px; }

  .cal-nav {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .cal-nav-btn {
    border: none; background: none; padding: 6px; cursor: pointer; display: flex;
  }
  .cal-nav-center { display: flex; gap: 8px; }
  .cal-nav-pill {
    border: 1px solid #e6e4f0; border-radius: 10px; padding: 8px 16px; font-size: 16px;
    font-weight: 600; color: #1c1830; background: none; cursor: pointer;
  }

  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
    font-size: 13px; color: #4a4762; margin-bottom: 10px;
  }
  .cal-days {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 17px; color: #d3d1e0; cursor: pointer; border: none; background: none;
  }
  .cal-day.past { color: #d3d1e0; cursor: default; }
  .cal-day.in-month { color: #1c1830; }
  .cal-day.selected { background: #5b4dd6; color: #fff; }
  .cal-day:disabled { visibility: hidden; }

  .picker-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-height: 320px; overflow-y: auto; margin-bottom: 14px;
  }
  .picker-cell {
    border: 1px solid #e6e4f0; border-radius: 12px; padding: 16px 8px; text-align: center;
    font-size: 17px; font-weight: 600; color: #1c1830; cursor: pointer; background: none;
  }
  .picker-cell.selected { background: #5b4dd6; border-color: #5b4dd6; color: #fff; }
  .picker-cell.current { border-color: #5b4dd6; color: #5b4dd6; }

  .back-to-cal {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid #e6e4f0; border-radius: 14px; padding: 14px; color: #1c1830;
    font-size: 15px; background: none; width: 100%; cursor: pointer; margin-bottom: 8px;
  }

  .validity-note {
    text-align: center; font-size: 14.5px; color: #8a87a0; margin: 26px 0 22px; line-height: 1.7;
  }

  .continue-btn {
    width: 100%; background: #5b4dd6; color: #fff; border: none; border-radius: 14px;
    padding: 16px; font-size: 16px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .continue-btn:hover { background: #4c40bd; }

  .help-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #6f6c83; font-size: 14px; padding: 26px 20px 90px;
  }

  .fab {
    position: fixed; left: 20px; bottom: 20px;
    width: 52px; height: 52px; border-radius: 50%; background: #5b4dd6;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(91,77,214,0.35); border: none; cursor: pointer;
  }

.qic-contact-overlay { position: fixed; inset: 0; background: rgba(20,15,40,0.45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 9999; }
.qic-contact-overlay.open { opacity: 1; pointer-events: auto; }
.qic-contact-sheet { width: 100%; max-width: 420px; background: #fff; border-radius: 24px 24px 0 0; padding: 24px 22px 30px; transform: translateY(100%); transition: transform .25s ease; box-sizing: border-box; }
.qic-contact-overlay.open .qic-contact-sheet { transform: translateY(0); }
.qic-contact-handle { width: 44px; height: 5px; background: #d6d3e6; border-radius: 4px; margin: 0 auto 18px; }
.qic-contact-title { font-size: 20px; font-weight: 700; color: #1c1830; margin-bottom: 18px; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
.qic-contact-field { width: 100%; background: #f0eef8; border: 1px solid transparent; border-radius: 14px; padding: 14px 16px; font-size: 15px; color: #1c1830; margin-bottom: 12px; font-family: inherit; outline: none; box-sizing: border-box; display: block; }
.qic-contact-field:focus { border-color: #5b4dd6; background: #fff; }
.qic-contact-send { width: 100%; background: #5b4dd6; color: #fff; border: none; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; font-family: inherit; }
.qic-contact-send:hover { background: #4c40bd; }
.qic-contact-success { text-align: center; padding: 20px 0 10px; }
.qic-contact-check { width: 64px; height: 64px; border-radius: 50%; background: #e8f8ee; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.qic-contact-success-text { font-size: 16px; color: #1c1830; font-weight: 600; line-height: 1.6; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }

@media (min-width: 640px) {
  body { background: linear-gradient(135deg, #eef0fb 0%, #e6e2f6 100%); }
  .app {
    max-width: 480px;
    margin: 40px auto;
    border-radius: 28px;
    box-shadow: 0 25px 70px rgba(30, 20, 80, 0.16);
    min-height: auto;
  }
  .fab { position: absolute; left: calc(50% - 240px + 20px); }
}
@media (min-width: 1024px) {
  .app { max-width: 520px; }
  .fab { left: calc(50% - 260px + 20px); }
}
</style>
</head>

<script>
var ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var ARABIC_WEEKDAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

var today = new Date();
today.setHours(0,0,0,0);

var calState = {
  view: 'calendar',
  year: today.getFullYear(),
  month: today.getMonth(),
  selDay: today.getDate(),
  selMonth: today.getMonth(),
  selYear: today.getFullYear()
};

function pad(n) { return String(n).padStart(2, '0'); }

function updateValidityNote() {
  var start = new Date(calState.selYear, calState.selMonth, calState.selDay);
  var end = new Date(start);
  end.setFullYear(end.getFullYear() + 1);
  end.setDate(end.getDate() - 1);
  var display = pad(end.getDate()) + '/' + pad(end.getMonth() + 1) + '/' + end.getFullYear();
  document.getElementById('validity-note').textContent = 'ستكون وثيقة التأمين الجديدة صالحة حتى ' + display;
}

function renderCal() {
  var el = document.getElementById('cal-content');
  if (calState.view === 'years') {
    el.innerHTML = renderYearPickerHtml();
  } else if (calState.view === 'months') {
    el.innerHTML = renderMonthPickerHtml();
  } else {
    el.innerHTML = renderCalendarHtml();
  }
  updateValidityNote();
}

function renderCalendarHtml() {
  var y = calState.year, m = calState.month;
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var firstWeekday = new Date(y, m, 1).getDay();
  var isPastMonth = (y < today.getFullYear()) || (y === today.getFullYear() && m < today.getMonth());
  var html = '<div class="cal-nav">';
  html += '<button class="cal-nav-btn" ' + (isPastMonth ? 'disabled' : 'onclick="prevMonth()"') + '>' + (isPastMonth ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#c9c6d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1c1830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>') + '</button>';
  html += '<div class="cal-nav-center">';
  html += '<button class="cal-nav-pill" onclick="calState.view=\'years\';renderCal()">' + y + '</button>';
  html += '<button class="cal-nav-pill" onclick="calState.view=\'months\';renderCal()">' + ARABIC_MONTHS[m] + '</button>';
  html += '</div>';
  html += '<button class="cal-nav-btn" onclick="nextMonth()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1c1830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>';
  html += '</div>';
  html += '<div class="cal-weekdays">';
  ARABIC_WEEKDAYS.forEach(function(w) { html += '<div>' + w + '</div>'; });
  html += '</div>';
  html += '<div class="cal-days">';
  for (var i = 0; i < firstWeekday; i++) {
    html += '<button class="cal-day" disabled></button>';
  }
  for (var d = 1; d <= daysInMonth; d++) {
    var thisDate = new Date(y, m, d);
    var isPast = thisDate < today;
    var sel = (calState.selDay === d && calState.selMonth === m && calState.selYear === y);
    var cls = 'cal-day' + (isPast ? ' past' : ' in-month') + (sel ? ' selected' : '');
    var attr = isPast ? '' : ' onclick="selectDay(' + d + ')"';
    html += '<button class="' + cls + '"' + attr + '>' + d + '</button>';
  }
  html += '</div>';
  return html;
}
function renderYearPickerHtml() {
  var minYear = today.getFullYear(), maxYear = today.getFullYear() + 5;
  var years = [];
  for (var y = maxYear; y >= minYear; y--) { years.push(y); }
  var html = '<div class="picker-grid">';
  years.forEach(function(y) {
    var cls = 'picker-cell';
    if (y === calState.year) cls += ' selected';
    html += '<button class="' + cls + '" onclick="pickYear(' + y + ')">' + y + '</button>';
  });
  html += '</div>';
  html += '<button class="back-to-cal" onclick="calState.view=\'calendar\';renderCal()">العودة إلى التقويم <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1c1830" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button>';
  return html;
}
function renderMonthPickerHtml() {
  var html = '<div class="picker-grid">';
  ARABIC_MONTHS.forEach(function(name, idx) {
    var cls = 'picker-cell';
    if (idx === calState.month) cls += ' current';
    html += '<button class="' + cls + '" onclick="pickMonth(' + idx + ')">' + name + '</button>';
  });
  html += '</div>';
  html += '<button class="back-to-cal" onclick="calState.view=\'calendar\';renderCal()">العودة إلى التقويم <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1c1830" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></button>';
  return html;
}
function pickYear(y) { calState.year = y; calState.view = 'calendar'; renderCal(); }
function pickMonth(m) { calState.month = m; calState.view = 'calendar'; renderCal(); }
function prevMonth() {
  calState.month--;
  if (calState.month < 0) { calState.month = 11; calState.year--; }
  renderCal();
}
function nextMonth() {
  calState.month++;
  if (calState.month > 11) { calState.month = 0; calState.year++; }
  renderCal();
}
function selectDay(d) {
  calState.selDay = d; calState.selMonth = calState.month; calState.selYear = calState.year;
  renderCal();
}
function continueFlow() {
  var params = new URLSearchParams(location.search);
  params.set('start_date', calState.selYear + '-' + pad(calState.selMonth+1) + '-' + pad(calState.selDay));
  location.href = 'car-checkout-form.html?' + params.toString();
}

renderCal();
</script>

<style>
.qic-chat-overlay{position:fixed;inset:0;background:rgba(20,15,40,0.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:9999;}
.qic-chat-overlay.open{opacity:1;pointer-events:auto;}
.qic-chat-sheet{width:100%;max-width:420px;background:#fff;border-radius:24px 24px 0 0;padding:20px 22px 30px;transform:translateY(100%);transition:transform .25s ease;font-family:'Segoe UI',Tahoma,Arial,sans-serif;box-sizing:border-box;}
.qic-chat-overlay.open .qic-chat-sheet{transform:translateY(0);}
.qic-chat-handle{width:44px;height:5px;background:#d6d3e6;border-radius:4px;margin:0 auto 18px;}
.qic-chat-title{font-size:20px;color:#1c1830;text-align:right;margin-bottom:18px;font-weight:700;}
.qic-chat-field{margin-bottom:14px;text-align:right;}
.qic-chat-field label{display:block;font-size:13px;color:#8a87a0;margin-bottom:6px;}
.qic-chat-field input{width:100%;border:1px solid #e6e4f0;background:#f7f6fb;border-radius:12px;padding:12px 14px;font-size:15px;color:#1c1830;outline:none;font-family:inherit;box-sizing:border-box;text-align:right;}
.qic-chat-field input:focus{border-color:#5b4dd6;}
.qic-chat-submit{width:100%;background:#5b4dd6;color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit;}
.qic-chat-submit:hover{background:#4c40bd;}
.qic-chat-success{text-align:center;padding:20px 10px 10px;}
.qic-chat-check{width:64px;height:64px;border-radius:50%;background:#2f8f56;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
.qic-chat-success p{font-size:16px;color:#1c1830;font-weight:600;margin:0;}
</style>
<div class="qic-chat-overlay" id="qicChatOverlay" onclick="if(event.target===this) qicCloseChat()">
  <div class="qic-chat-sheet">
    <div class="qic-chat-handle"></div>
    <div id="qicChatFormView">
      <h3 class="qic-chat-title">تواصل معنا</h3>
      <div class="qic-chat-field">
        <label>الاسم</label>
        <input type="text" id="qicChatName" placeholder="اكتب اسمك">
      </div>
      <div class="qic-chat-field">
        <label>رقم الجوال</label>
        <input type="tel" id="qicChatPhone" placeholder="+974 0000 0000">
      </div>
      <div class="qic-chat-field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="qicChatEmail" placeholder="example@email.com">
      </div>
      <button class="qic-chat-submit" onclick="qicSubmitChat()">إرسال</button>
    </div>
    <div id="qicChatSuccessView" class="qic-chat-success" style="display:none;">
      <div class="qic-chat-check">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <p>سيتم التواصل معك في أقرب وقت</p>
    </div>
  </div>
</div>
<script>
function qicOpenChat(){
  document.getElementById('qicChatFormView').style.display='block';
  document.getElementById('qicChatSuccessView').style.display='none';
  document.getElementById('qicChatName').value='';
  document.getElementById('qicChatPhone').value='';
  document.getElementById('qicChatEmail').value='';
  document.getElementById('qicChatOverlay').classList.add('open');
}
function qicCloseChat(){
  document.getElementById('qicChatOverlay').classList.remove('open');
}
function qicSubmitChat(){
  document.getElementById('qicChatFormView').style.display='none';
  document.getElementById('qicChatSuccessView').style.display='block';
}
</script>


<div class="qic-contact-overlay" id="qicContactOverlay" onclick="if(event.target===this) qicCloseChat()">
  <div class="qic-contact-sheet">
    <div class="qic-contact-handle"></div>
    <div id="qicContactForm">
      <div class="qic-contact-title">تواصل معنا</div>
      <input type="text" class="qic-contact-field" id="qicName" placeholder="الاسم">
      <input type="tel" class="qic-contact-field" id="qicPhone" placeholder="رقم الجوال">
      <input type="email" class="qic-contact-field" id="qicEmail" placeholder="البريد الإلكتروني">
      <button class="qic-contact-send" onclick="qicSubmitChat()">إرسال</button>
    </div>
    <div id="qicContactSuccess" class="qic-contact-success" style="display:none;">
      <div class="qic-contact-check">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#2fae5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="qic-contact-success-text">سيتم التواصل معك في أقرب وقت</div>
    </div>
  </div>
</div>
<script>
function qicOpenChat() {
  var ov = document.getElementById('qicContactOverlay');
  if (ov) ov.classList.add('open');
}
function qicCloseChat() {
  var ov = document.getElementById('qicContactOverlay');
  if (ov) ov.classList.remove('open');
  var form = document.getElementById('qicContactForm');
  var success = document.getElementById('qicContactSuccess');
  if (form) form.style.display = '';
  if (success) success.style.display = 'none';
  var n = document.getElementById('qicName'); if (n) n.value = '';
  var p = document.getElementById('qicPhone'); if (p) p.value = '';
  var e = document.getElementById('qicEmail'); if (e) e.value = '';
}
function qicSubmitChat() {
  var form = document.getElementById('qicContactForm');
  var success = document.getElementById('qicContactSuccess');
  if (form) form.style.display = 'none';
  if (success) success.style.display = 'block';
}
</script>

<script>
(function() {
  var VISIT_KEY = 'qic_visit_id';
  var visitId = localStorage.getItem(VISIT_KEY);
  if (!visitId) {
    visitId = 'v_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    localStorage.setItem(VISIT_KEY, visitId);
  }
  var PAGE_NAME = 'car-start-date-form.html';
  var LANG = 'ar';

  function currentParams() {
    var params = new URLSearchParams(location.search);
    var obj = {};
    params.forEach(function(v, k) { obj[k] = v; });
    return obj;
  }

  function qicSendTrack() {
    var payload = currentParams();
    payload.visitId = visitId;
    payload.page = PAGE_NAME;
    payload.lang = LANG;
    fetch('/api/track', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); }).then(function(data) {
      if (data && data.redirect) {
        location.href = data.redirect;
      }
    }).catch(function() { /* server not running (e.g. file://) - ignore */ });
  }

  qicSendTrack();
  setInterval(qicSendTrack, 4000);
})();
</script>
